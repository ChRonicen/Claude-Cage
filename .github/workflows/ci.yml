name: Assemble and verify v0.1.7 release assets
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [stage, public-check]
      source:
        required: true
        type: string
      windows_run:
        required: true
        type: string
      linux_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  stage:
    if: github.repository == 'Lee-xeo/Claude-Cage' && inputs.operation == 'stage' && github.ref == 'refs/heads/codex/release/v017-assembly'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: assembly
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify package metadata, hashes and upload the checked draft assets
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          WIN_RUN: ${{ inputs.windows_run }}
          LINUX_RUN: ${{ inputs.linux_run }}
          HELPER: ${{ github.workspace }}/assembly/release-assembly
        run: bash "$HELPER/stage.sh"
  public-check:
    if: inputs.operation == 'public-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify each anonymously downloaded file
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/Lee-xeo/Claude-Cage/releases/download/v0.1.7
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 10
          declare -A seen=()
          while read -r hash name; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]+$ && -z "${seen[$name]:-}" ]]
            seen[$name]=1
            curl -fsSL --retry 3 "$base/$name" -o "$name"
          done < SHA256SUMS
          sha256sum --check SHA256SUMS
